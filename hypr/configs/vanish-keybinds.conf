#################################################################
# VANISH MODE DEDICATED SHORTCUTS                               #
# Auto-generated by Carbon Config Editor (Vanish Shortcuts tab) #
# Isolated from keybinds.conf and variables.lua                 #
#################################################################

$mainMod = SUPER

bindr = , Super_L, exec, sh ~/.config/carbon/scripts/carbon-vanish-dispatch.sh toggle-hub
bindr = $mainMod, Alt_L, exec, sh ~/.config/carbon/scripts/carbon-vanish-dispatch.sh launcher
bindr = ALT, Super_L, exec, sh ~/.config/carbon/scripts/carbon-vanish-dispatch.sh launcher
bindr = ALT, Super_R, exec, sh ~/.config/carbon/scripts/carbon-vanish-dispatch.sh launcher
bind = $mainMod, M, exec, sh ~/.config/carbon/scripts/carbon-vanish-dispatch.sh lyrics
bind = $mainMod, N, exec, sh ~/.config/carbon/scripts/carbon-vanish-dispatch.sh wallpaper
bind = $mainMod, C, exec, sh ~/.config/carbon/scripts/carbon-vanish-dispatch.sh focus-connect
bind = $mainMod, Tab, exec, sh ~/.config/carbon/scripts/carbon-vanish-dispatch.sh focus-spaces
bind = $mainMod SHIFT, N, exec, sh ~/.config/carbon/scripts/carbon-vanish-dispatch.sh focus-alerts
