#################################################################
# CARBON SHELL — TOUCHPAD & MULTI-FINGER GESTURES               #
# Location: ~/.config/carbon/configs/gestures.conf              #
# Applied automatically by carbon-gestures-init.sh              #
#################################################################

# Touchpad Settings
natural_scroll = true
disable_while_typing = true
tap_to_click = true
scroll_factor = 1.0
workspace_swipe = true
workspace_swipe_fingers = 3
workspace_swipe_distance = 400
workspace_swipe_invert = false
workspace_swipe_create_new = true

# Multi-Finger Touchpad Gesture Binds
gesture = 3, horizontal, workspace
gesture = 3, up, dispatcher, exec, sh ~/.config/carbon/scripts/carbon-ipc.sh toggle-overview
gesture = 3, down, dispatcher, exec, sh ~/.config/carbon/scripts/carbon-ipc.sh spatial-canvas
gesture = 4, up, dispatcher, fullscreen
gesture = 4, down, dispatcher, exec, ~/.config/carbon/scripts/carbon-screenshot-full.sh
