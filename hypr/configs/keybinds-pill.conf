#################################################################
# CARBON SHELL — PILL MODE KEYBINDINGS                         #
# Active when Bar Mode is set to Pill / Waybar                  #
#################################################################

$mainMod = SUPER

# Mode Specific Shortcuts
bind = $mainMod, R, exec, ~/.config/carbon/scripts/carbon-ipc.sh toggle-spotlight
bind = $mainMod, B, exec, ~/.config/carbon/scripts/carbon-ipc.sh controls
bind = $mainMod, K, exec, ~/.config/carbon/scripts/carbon-focus.sh
bind = $mainMod SHIFT, C, exec, ~/.config/carbon/scripts/carbon-settings-hub

# Window Focus Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
